name: Calculator
id: com.grimoire.calculator
type: widget
version: 1.3.1
author: Nebuff
description: Simple, scientific, programming, finance and graphing calculators, with a unit converter.
license: MIT
repository: https://github.com/nebuff/gri-calc
min_grimoire_version: 2.1.0
platforms: [all]
artifact:
  path: calculator.bin
  sha256: 3bc3f3ffb567dc7274871ec73d5d7bf39d3fd10ae074e6ed872274d0a6158de6
  size: 129728
capabilities: [editor:overlay]
settings:
  - key: default_calculator
    label: Default calculator
    type: choice
    default: Simple
    choices: [Simple, Scientific, Programming, Finance, Graphing]
  - key: enable_simple
    label: Simple calculator
    type: toggle
    default: true
  - key: enable_scientific
    label: Scientific calculator
    type: toggle
    default: true
  - key: enable_programming
    label: Programming calculator
    type: toggle
    default: true
  - key: enable_finance
    label: Finance calculator
    type: toggle
    default: true
  - key: enable_graphing
    label: Graphing calculator
    type: toggle
    default: true
spec:
  runtime: wasm
  entry: _start
  icon: calculator
  minimizable: true
  size:
    mode: resizable
    default: [340, 560]
    min: [280, 480]
    max: [620, 820]
